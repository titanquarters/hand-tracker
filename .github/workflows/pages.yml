# Publishes the app to GitHub Pages, which gives it the HTTPS origin that
# browsers require before they will hand out camera access.
name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is the feature branch below; `main` is listed
    # too so the workflow keeps working once the work lands there.
    branches:
      - main
      - claude/iphone-hand-skeleton-detection-wv8l1n
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Keeps the Pages source pointed at Actions. Note this cannot bootstrap a
      # repository where Pages has never been switched on: the github-pages
      # environment gate is evaluated before any step runs, so the job is
      # rejected before this step could enable anything. Pages has to be turned
      # on once under Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
