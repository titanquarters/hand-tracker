<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Skeleton Mirror</title>
<meta name="description" content="Step in front of the camera and watch your body fall away." />
<meta name="theme-color" content="#04060a" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/mirror.css" />
</head>
<body>

<div id="frame">
  <video id="video" playsinline autoplay muted></video>
  <!-- 2D layer: paints the tracked bodies out of the picture -->
  <canvas id="stage"></canvas>
  <!-- 3D layer: the skeletons themselves, lit and depth-sorted -->
  <canvas id="gl"></canvas>
</div>

<!-- Offscreen scratch buffer for the body-erase mask -->
<canvas id="maskbuf" width="1" height="1" hidden></canvas>

<div id="hud" class="hidden"><span id="stat">0 bodies</span><span id="build"></span></div>

<div id="idle" class="hidden">
  <p>Step into the light</p>
</div>

<div id="splash">
  <div class="card">
    <h1>Skeleton<span>Mirror</span></h1>
    <p id="splashMsg">Stand still, and see what you are underneath.</p>
    <button id="btnStart" class="primary">Begin</button>
    <p class="fine">Nothing is recorded. Everything happens on this machine.</p>
    <p class="fine credit">Skeleton from <a href="https://github.com/LluisV/Z-Anatomy" target="_blank" rel="noopener">Z-Anatomy</a>,
      <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC&nbsp;BY-SA&nbsp;4.0</a></p>
  </div>
</div>

<script type="module" src="js/mirror/app.js"></script>
</body>
</html>
